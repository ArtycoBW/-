# Overlay for compose.review.yml only. Loopback access; never use demo credentials publicly.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:8089
      KC_HTTP_ENABLED: "true"
    ports: ["127.0.0.1:8089:8080"]
    volumes:
      - ./integrations/fsp-local/realm.json:/opt/keycloak/data/import/realm.json:ro
      - fsp-keycloak:/opt/keycloak/data
    logging:
      options: {max-size: "10m", max-file: "2"}
  fsp-mock:
    image: razryad-api:1.3-review
    command: [python, -m, uvicorn, backend.fsp_mock:app, --host, 0.0.0.0, --port, "8010", --no-access-log]
    environment:
      FSP_MODE: local
      FSP_ISSUER: http://localhost:8089/realms/razryad-fsp-local
      FSP_MOCK_JWKS: http://keycloak:8080/realms/razryad-fsp-local/protocol/openid-connect/certs
    depends_on: [keycloak]
  api:
    environment:
      FSP_MODE: local
      FSP_ISSUER: http://localhost:8089/realms/razryad-fsp-local
      FSP_BACKCHANNEL_ORIGIN: http://keycloak:8080
      FSP_CLIENT_ID: razryad
      FSP_FLOW_SECRET: ${FSP_FLOW_SECRET:?Generate .local/fsp-local.env first}
      FSP_ACHIEVEMENTS_URL: http://fsp-mock:8010/me/achievements
volumes:
  fsp-keycloak: {}
